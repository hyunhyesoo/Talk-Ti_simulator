<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>똑띠(Talk-Ti) 음성 명령 입력</title>
    <style>
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background-color: #f4f4f4; font-family: 'Pretendard', sans-serif; padding: 20px; }
        .container { background-color: #FEFAF4; border-radius: 24px; padding: 50px 40px; text-align: center; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05); max-width: 500px; width: 100%; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
        .back-btn { background: none; border: none; font-size: 20px; color: #888; cursor: pointer; }
        .stage-badge { background-color: #FF7B30; color: white; padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 800; }
        .mic-container { width: 100px; height: 100px; background-color: #fff; border-radius: 50%; margin: 0 auto 30px; display: flex; justify-content: center; align-items: center; font-size: 40px; border: 3px solid #F6C85F; animation: pulse-mic 2s infinite; }
        @keyframes pulse-mic { 0% { box-shadow: 0 0 0 0 rgba(246, 200, 95, 0.4); } 70% { box-shadow: 0 0 0 20px rgba(246, 200, 95, 0); } 100% { box-shadow: 0 0 0 0 rgba(246, 200, 95, 0); } }
        .title { font-size: 22px; font-weight: 800; color: #333; margin-bottom: 10px; }
        .desc { font-size: 14px; color: #777; margin-bottom: 30px; line-height: 1.5; }
        .command-input { width: 100%; padding: 18px 20px; border-radius: 12px; border: 2px solid #e0e0e0; font-size: 16px; margin-bottom: 15px; box-sizing: border-box; text-align: center; }
        .submit-btn { background-color: #FF7B30; color: white; border: none; border-radius: 12px; padding: 18px; font-size: 18px; font-weight: bold; cursor: pointer; width: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <button class="back-btn" onclick="window.location.href='stage.html'">❮ 뒤로</button>
            <div class="stage-badge" id="current-stage">STAGE 1</div>
        </div>
        <div class="mic-container">🎙️</div>
        <div class="title">똑띠에게 무엇을 도와달라고 할까요?</div>
        <div class="desc">원하시는 요청 사항을 텍스트로 입력해 주세요.</div>
        <div>
            <input type="text" id="command-input" class="command-input" autocomplete="off">
            <button class="submit-btn" onclick="processCommand()">요청하기</button>
        </div>
    </div>

    <script>
        window.onload = () => {
            const urlParams = new URLSearchParams(window.location.search);
            const stage = urlParams.get('stage');
            if(stage) {
                document.getElementById('current-stage').innerText = `STAGE ${stage}`;
                const inputEl = document.getElementById('command-input');
                if(stage === '1') inputEl.placeholder = "예: 엄마한테 사진 보내줘";
                else if(stage === '2') inputEl.placeholder = "예: 서울역으로 길 찾아줘";
                else if(stage === '3') inputEl.placeholder = "예: 한남역 가는 택시 탈래";
                else if(stage === '4') inputEl.placeholder = "예: 카페라떼 시켜줘";
            }
        };

        // 요청하기 버튼을 눌렀을 때
        function processCommand() {
            const inputVal = document.getElementById('command-input').value;
            // common.js 안에 들어있는 라우팅 두뇌를 호출!
            routeCommand(inputVal);
        }
    </script>
    <script src="common.js"></script>
</body>
</html>
